name: V5 Groq Research

on:
  workflow_dispatch:
  push:
    branches: [v5-research]
    paths:
      - 'configs/v5_failure_context.json'
      - '.github/workflows/v5-groq-research.yml'
  pull_request:
    paths:
      - 'configs/v5_failure_context.json'
      - '.github/workflows/v5-groq-research.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[llm]'
      - name: Detect Groq secret
        id: groq
        shell: bash
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'GROQ_API_KEY secret is not configured for this repository.'
          fi
      - name: Run V5 failure-focused multi-model research
        if: steps.groq.outputs.available == 'true'
        run: >-
          python scripts/run_v4_groq.py
          --context configs/v5_failure_context.json
          --artifact-dir artifacts/v5_groq
      - name: Upload V5 research artifacts
        if: steps.groq.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v5-groq-research
          path: artifacts/v5_groq
