name: V7 Research Council

on:
  push:
    branches:
      - v7-factor-observatory
    paths:
      - .github/workflows/v7-research-council.yml
      - artifacts/multi_asset_v7/research_council_context.json
      - scripts/run_v7_groq_council.py
      - src/crypto_research/groq_v7.py
      - src/crypto_research/hypotheses_v7.py
      - src/crypto_research/diagnostics_v7.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-council:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Groq client
        run: python -m pip install "groq>=1.0"
      - name: Verify secret availability
        shell: bash
        run: test -n "$GROQ_API_KEY"
      - name: Run sanitized V7 council
        run: python scripts/run_v7_groq_council.py
      - name: Upload council artifact
        uses: actions/upload-artifact@v4
        with:
          name: v7-groq-council
          path: artifacts/multi_asset_v7/groq_council_output.json
          if-no-files-found: error
          retention-days: 14
