name: V4 Groq Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/crypto_research/groq_v4.py'
      - 'src/crypto_research/v4_research.py'
      - 'scripts/run_v4_groq.py'
      - 'configs/v4_research_context.json'
      - '.github/workflows/v4-groq-research.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[llm]'
      - name: Detect Groq secret
        id: groq
        shell: bash
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'GROQ_API_KEY secret is not configured for this repository.'
          fi
      - name: Run V4 multi-model research
        if: steps.groq.outputs.available == 'true'
        run: >-
          python scripts/run_v4_groq.py
          --context configs/v4_research_context.json
          --artifact-dir artifacts/v4_groq
      - name: Upload V4 research artifacts
        if: steps.groq.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v4-groq-research
          path: artifacts/v4_groq
