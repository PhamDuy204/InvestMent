name: V5 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Pytest
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-pytest-log
          path: pytest.log
      - run: ruff check src tests
      - run: python -m compileall -q src tests

  research-council:
    if: github.event_name == 'pull_request' && github.head_ref == 'v7-factor-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Check one-shot marker
        id: gate
        shell: bash
        run: |
          if [ -f artifacts/multi_asset_v7/run_groq_council.flag ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Install Groq client
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install "groq>=1.0"
      - name: Verify secret availability
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: test -n "$GROQ_API_KEY"
      - name: Run sanitized V7 council
        if: steps.gate.outputs.enabled == 'true'
        run: python scripts/run_v7_groq_council.py
      - name: Upload council artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v7-groq-council
          path: artifacts/multi_asset_v7/groq_council_output.json
          if-no-files-found: error
          retention-days: 14
